name: Update screenshots portofolio
on:
  workflow_dispatch:        # jalankan manual dari tab Actions
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save playwright sharp
      - run: npx playwright install --with-deps chromium
      - run: node tools/screenshots.mjs
      - name: Commit screenshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/porto
          git diff --cached --quiet || (git commit -m "chore: update screenshot portofolio" && git push)
